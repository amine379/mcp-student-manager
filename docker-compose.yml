services:

  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: studentdb
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spring Boot Backend ─────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: student-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: studentdb
      DB_USERNAME: postgres
      DB_PASSWORD: root
      JPA_DDL_AUTO: create
      SQL_INIT_MODE: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── MCP Python Server ──────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: student-mcp
    environment:
      API_BASE_URL: http://backend:8080/api
    depends_on:
      - backend

volumes:
  pgdata:
