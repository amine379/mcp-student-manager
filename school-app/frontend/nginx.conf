server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 6 photos x 8 Mo max par envoi
    client_max_body_size 50m;

    # Résolution DNS Docker à chaque requête : nginx démarre même si le backend
    # n'est pas (encore) là, au lieu de planter en boucle.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        expires 7d;
        add_header Cache-Control "private";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html jamais en cache : une mise à jour est vue tout de suite
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
